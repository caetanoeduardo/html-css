<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 05</title>
    <style>
        table {
            width: 500px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        caption {
            font-weight: bold;
            margin-bottom: 10px;
        }
        colgroup col.nome {
            width: 50px;
            background-color: lightslategray;
        }
        colgroup col.sexo {
            width: 100px;
            background-color: rgb(255, 125, 125);
        }
        colgroup col.idade {
            width: 80px;
            background-color: rgb(125, 255, 125);
        }
        colgroup col.profissao {
            width: 170px;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="nome">
            <col class="sexo">
            <col class="idade" span="2">
            <col class="profissao">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>João</td>
            <td>Masculino</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Feminino</td>
            <td>22</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>Masculino</td>
            <td>35</td>
            <td>Arquiteto</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>Feminino</td>
            <td>27</td>
            <td>Desenvolvedora</td>
        </tr>
    </table>
</body>
</html>
