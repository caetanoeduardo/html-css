<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
</head>
<body>
    <h1></h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="masculino"> <label for="masculino">Masculino</label> <br>
            <input type="radio" name="sexo" id="feminino"> <label for="feminino">Feminino</label> <br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esportes" id="futebol"> <label for="futebol">Futebol</label> <br>

            <input type="checkbox" name="esportes" id="basquete"> <label for="basquete">Basquete</label> <br>

            <input type="checkbox" name="esportes" id="volei"> <label for="volei">Vôlei</label> <br>
            
            <input type="checkbox" name="esportes" id="natacao"> <label for="natacao">Natação</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
