<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - 04</title>
</head>
<body>
    <h1>Formulário - 04</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
      
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome Completo:</label>
                <input type="text" name="nome" id="inome" size="40" maxlength="50" minlength="8" placeholder="Nome Completo" required autocomplete="name">
            </p>
            <p>
                <label for="iemail">Email:</label>
                <input type="email" name="email" id="iemail" size="30" maxlength="50" placeholder="Email" required autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="tel" id="itel" size="15" maxlength="15" placeholder="(00) 00000-0000" required autocomplete="tel">
            </p>
            <!-- Se aprofundar em RegEx-->
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>
</html>
