<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box </title>
    <style>
        div.container{
            background-color: rgb(0, 136, 255);
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: rgb(0, 255, 255);
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            flex-basis: 200px;
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxa{
            flex-grow: 1;
            flex-shrink: 0;
        }

        div#cxb{
            flex-grow: 1;
            flex-shrink: 4;
        }

        div#cxv{
            flex-grow: 1;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div>
</body>
</html>
